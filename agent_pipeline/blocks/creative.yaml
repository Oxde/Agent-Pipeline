id: creative
name: Creative work
description: >
  A phase whose output is judged rather than measured — a script, a headline, a
  design direction, a piece of writing. There is no exit code for "is this any
  good", so the block does the next best thing: it turns taste into named,
  recorded criteria that cannot be waved through.

# Creative work is the one kind that genuinely iterates. Every attempt is kept.
iterate: true
max_iterations: 5
archive: true

artifact: "{workdir}/{phase}.md"

guidance: |
  Before you write anything, decide the ONE thing this has to land. Write it
  down in a line. If you cannot, you are not ready to draft — you are still
  researching, and drafting now produces something that is about everything and
  lands nothing.

  Then:

  - Be specific enough that nobody else could have written it. Generic is the
    default failure mode of anything generated, and it is invisible from the
    inside. If a competitor could sign their name under this line unchanged,
    the line is not yours and it is not doing any work.
  - Make something change. A piece where the reader knows the same things at
    the end as at the start is information, not a piece. Set an expectation,
    then overturn it.
  - Cut whatever does not carry the one thing. Length is not evidence of
    effort; most first drafts are twice the size of the piece inside them.
  - Read it aloud. Anything you stumble over, the reader stumbles over.

  First drafts are for finding the point, not for shipping. This block allows
  iterations and preserves every one of them, so revise rather than defending
  the first thing that came out.

criteria:
  - id: no-placeholders
    kind: mechanical
    description: No TODO / TBD / lorem ipsum left in the artifact.
    run: python3 {engine}/checks/no_placeholders.py {artifact}

  - id: substance
    kind: mechanical
    description: The artifact has enough body to be the work it claims to be.
    run: python3 {engine}/checks/min_substance.py {artifact} --min-words 40

  - id: one-point
    kind: judged
    description: The piece makes ONE point rather than gesturing at several.
    ask: >
      State, in one sentence, the single point this piece makes. If you cannot
      do that without using "and" to join two different claims, answer FAIL.
      Otherwise answer PASS and give the sentence.

  - id: has-turn
    kind: judged
    description: Something changes — an expectation is set and then overturned.
    ask: >
      Quote the line where the reader's expectation is overturned. If there is
      no such line — if the piece only accumulates and never turns — answer
      FAIL.

  - id: only-you
    kind: judged
    description: Specific enough that a competitor could not sign it unchanged.
    ask: >
      Could a direct competitor publish this piece under their own name with no
      edits? If yes, answer FAIL and quote the most generic line. If no, answer
      PASS and quote the line that could only come from us.
