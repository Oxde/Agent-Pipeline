id: approval
name: Human approval gate
description: >
  A deliberate stop. Nothing downstream may proceed until a person has decided,
  and the decision is recorded with its reason. Put one of these immediately
  before anything expensive or irreversible.

guidance: |
  This phase is not work. It is a wall.

  Present exactly what is being approved and nothing else — the artifact, the
  cost of proceeding, and the specific question being asked. An approval
  request that arrives as a wall of context is one that gets rubber-stamped,
  which defeats the entire purpose of stopping here.

  A correction is a valid outcome and is more useful than a rejection: record
  it with `approve <phase> <criterion> --status fail --note "<the correction>"`,
  then reopen the phase it applies to. The note is the instruction for the
  next attempt, so write it as one.

criteria:
  - id: approved
    kind: human
    description: A person has seen this and decided to proceed.
    ask: >
      Approve proceeding past this gate? Reply with the decision, and — if not
      approved — the correction the next attempt should apply.
