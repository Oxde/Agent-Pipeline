id: generate
name: Asset generation
description: >
  A phase that spends money on an external provider — images, video, audio,
  anything metered. Cost-aware, and expected to sit downstream of an approval.

cost_aware: true
artifact: "{workdir}/{phase}/manifest.json"

guidance: |
  Money leaves the building in this phase, so two rules hold.

  Never generate before the thing describing what to generate has been
  approved. Generating first and judging afterwards is how a rejected direction
  gets paid for three times.

  Log what you spent as you go:

      agent-pipeline cost <phase> --usd 0.63

  Unlogged spend is the reason nobody can answer "what did that piece cost",
  and the answer is always higher than remembered.

  Write a manifest listing every asset produced, with the model, the inputs and
  the price. When something looks wrong two weeks later, the manifest is the
  difference between reproducing it and guessing.

criteria:
  - id: manifest-populated
    kind: mechanical
    description: The manifest actually lists assets.
    run: python3 {engine}/checks/contains.py {artifact} --pattern "\"path\"" --min 1 --label assets

  - id: matches-spec
    kind: judged
    description: What was generated is what the approved spec asked for.
    ask: >
      Compare each generated asset against the approved spec it came from. Name
      any asset that differs from what was approved. If any does, answer FAIL.
